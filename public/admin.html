<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Millads Supermarket</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin-styles.css">
    <link rel="stylesheet" href="css/ui-buttons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Login Modal -->
    <div id="loginModal" class="login-modal">
        <div class="login-container">
            <div class="login-header">
                <h2><i class="fas fa-lock"></i> Admin Access Required</h2>
                <p>Enter the admin password to continue</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminPassword">Password:</label>
                    <input type="password" id="adminPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <div id="loginError" class="login-error" style="display: none;">
                    Incorrect password. Please try again.
                </div>
            </form>
        </div>
    </div>

    <div class="admin-panel" id="adminPanel" style="display: none;">
        <div class="admin-header">
            <h1><i class="fas fa-tachometer-alt"></i> Admin Panel</h1>
            <div class="admin-actions">
                <button onclick="refreshOrders()" class="btn-primary">
                    <i class="fas fa-refresh"></i> Refresh Orders
                </button>
                <span class="header__cart" style="padding:0;width:auto;">
                    <button type="button" onclick="logout()" class="signout-link" aria-label="Logout">
                        <span class="tooltip" aria-hidden="true">Logout</span>
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </span>
                <a href="index.html" class="btn-secondary">
                    <i class="fas fa-store"></i> Back to Store
                </a>
            </div>
        </div>
        
        <div class="admin-stats">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalOrders">0</h3>
                    <p>Total Orders</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="pendingOrders">0</h3>
                    <p>Pending Orders</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-dollar-sign"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalRevenue">$0</h3>
                    <p>Total Revenue</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-calendar-day"></i>
                </div>
                <div class="stat-info">
                    <h3 id="todayOrders">0</h3>
                    <p>Today's Orders</p>
                </div>
            </div>
        </div>
        
        <div class="admin-filters">
            <div class="filter-group">
                <label for="statusFilter">Filter by Status:</label>
                <select id="statusFilter" onchange="filterOrders()">
                    <option value="all">All Orders</option>
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="processing">Processing</option>
                    <option value="delivered">Delivered</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="dateFilter">Filter by Date:</label>
                <input type="date" id="dateFilter" onchange="filterOrders()">
            </div>
            
            <div class="filter-group">
                <button onclick="clearFilters()" class="btn-secondary">Clear Filters</button>
            </div>
        </div>
        
        <div class="orders-container">
            <h2>Recent Orders</h2>
            <div id="ordersContainer">
                <div class="loading">Loading orders...</div>
            </div>
        </div>
    </div>
    
    <script src="admin.js"></script>
</body>
</html>
