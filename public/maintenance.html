<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millad's Supermarket - Coming Soon</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2D6A4F 0%, #1B4332 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 600px; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        .subtitle { font-size: 1.5rem; opacity: 0.9; margin-bottom: 30px; }
        p { font-size: 1.1rem; line-height: 1.6; opacity: 0.8; margin-bottom: 30px; }
        .contact {
            background: rgba(255,255,255,0.1);
            padding: 20px 30px;
            border-radius: 10px;
            display: inline-block;
        }
        .contact p { margin-bottom: 10px; opacity: 1; }
        .contact a { color: #90EE90; text-decoration: none; }
        .contact a:hover { text-decoration: underline; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Millad's Supermarket</h1>
        <p class="subtitle">We're working on something great!</p>
        <p>Our website is currently under maintenance. We'll be back soon with a fresh new look and improved shopping experience.</p>
        <div class="contact">
            <p><strong>Visit us in store:</strong></p>
            <p>460 Notre Dame Ave, Winnipeg, MB</p>
            <p>📞 <a href="tel:+12049999999">+1 204-999-9999</a></p>
        </div>
    </div>
</body>
</html>
